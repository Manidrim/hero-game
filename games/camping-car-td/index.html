<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Camping-Car TD</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚐</text></svg>" />
  <link rel="stylesheet" href="game.css?v=1" />
</head>
<body>
  <div class="topbar">
    <a class="back" href="../../index.html">&larr; Arcade</a>
    <h1>🚐 Camping-Car TD</h1>
    <div class="stats">
      <span class="stat" title="Euros">💰 <b id="money">0</b></span>
      <span class="stat" title="Vies">❤️ <b id="lives">0</b></span>
      <span class="stat" title="Vague">🌊 <b id="wave">0</b></span>
      <span class="stat" title="Éliminations">💥 <b id="kills">0</b></span>
      <span class="stat" title="Niveau du campeur">⭐ niv. <b id="level">1</b>
        <span class="xpbar"><span id="xpfill"></span></span>
      </span>
      <span class="stat" title="Points de talent">🌳 <b id="points">0</b></span>
    </div>
    <div class="controls">
      <button id="start-wave" class="primary">▶ Vague 1</button>
      <label class="auto"><input type="checkbox" id="auto" /> auto</label>
      <button id="speed" title="Vitesse de jeu">⚡ x1</button>
      <button id="pause" title="Pause (P)">⏸</button>
      <button id="maps" title="Choisir une carte">🗺️</button>
      <button id="talents" title="Arbre de talents">🌳</button>
      <button id="achievements" title="Succès">🏆</button>
      <button id="help" title="Aide">❓</button>
      <button id="reset" class="ghost" title="Recommencer la partie">↺</button>
    </div>
  </div>

  <div class="layout">
    <aside class="panel panel-left">
      <section class="panel-block">
        <h3>🛒 Boutique</h3>
        <div id="shop-list" class="shop-list"></div>
        <p class="hint" id="shop-hint">Clique un véhicule puis clique sur l'herbe pour le poser. Clic droit ou Échap pour annuler.</p>
      </section>
      <section class="panel-block">
        <h3>📋 Vague suivante</h3>
        <div id="wave-info"></div>
      </section>
    </aside>

    <div class="board-wrap">
      <canvas id="game" width="960" height="576"></canvas>
      <div id="banner" class="banner hidden"></div>
      <div id="overlay" class="overlay hidden">
        <div class="overlay-box">
          <h2 id="overlay-title">Partie terminée</h2>
          <p id="overlay-text"></p>
          <div class="overlay-btns">
            <button id="overlay-retry" class="primary">Rejouer</button>
            <button id="overlay-maps" class="ghost">Changer de carte</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="panel">
      <section class="panel-block">
        <h3>🔍 Inspection</h3>
        <div id="inspector"></div>
      </section>
    </aside>
  </div>

  <div id="toasts" class="toasts"></div>

  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title"></h2>
        <button id="modal-close" class="ghost">✖</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
    </div>
  </div>

  <script type="module" src="src/main.js?v=1"></script>
</body>
</html>
